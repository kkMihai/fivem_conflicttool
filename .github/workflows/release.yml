name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish resource
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Check fxmanifest version is in sync
        run: |
          VERSION=$(node -p "require('./package.json').version")
          grep -q "^version '$VERSION'$" fxmanifest.lua || {
            echo "fxmanifest.lua version is out of sync, run npm run sync-version"
            exit 1
          }

      - run: npm ci --prefix web

      - run: npm run typecheck

      - run: npm run build

      - run: npm run package

      - name: Generate GitHub Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: npx --yes changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist-release/*.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: fivem_conflicttool
          path: dist-release/*.zip
